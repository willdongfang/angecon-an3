<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AN3</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111318;
      color: #f3f4f6;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      text-align: center;
    }
    main { padding: 2rem; }
    h1 {
      margin: 0;
      font-size: clamp(4rem, 14vw, 8rem);
      line-height: 1;
      letter-spacing: -0.08em;
      font-weight: 750;
    }
    p { margin: 1.25rem 0 0; color: #b6bac5; font-size: 1.1rem; }
    footer { margin-top: 3rem; color: #777d8b; font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <h1>AN3</h1>
    <p>流程已跑通</p>
    <footer>GitHub Pages · Codex</footer>
  </main>
</body>
</html>
